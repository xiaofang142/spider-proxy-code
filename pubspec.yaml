name: spider_proxy
description: A Flutter proxy application for network packet capture and analysis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP Proxy Server
  http_proxy: ^0.4.0
  
  # State Management
  flutter_redux: ^0.10.0
  redux: ^5.0.0
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Permission Handling
  permission_handler: ^11.1.0
  
  # Network Monitoring
  flutter_network_profiler: ^1.0.0
  connectivity_plus: ^5.0.2
  
  # In-App Purchases
  purchases_flutter: ^6.11.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  
  # HTTP Client
  http: ^1.1.0
  dio: ^5.4.0
  
  # Utilities
  uuid: ^4.2.1
  path: ^1.8.3

  # SSL/TLS Support
  crypto: ^3.0.3
  pkcs8: ^1.0.0
  pointycastle: ^3.7.4

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JavaScript Engine (v3.0)
  dart_eval: ^0.4.0

  # Code Highlight (v3.0)
  flutter_highlight: ^0.7.0

  # File Watcher (v3.1)
  watcher: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
